pre-commit:
  parallel: true
  commands:
    frontend-lint:
      root: frontend/
      glob: "*.{ts,tsx,css,json,md}"
      run: npm run verificar-formato && npm run lint
    backend-formato:
      root: backend/
      glob: "*.java"
      run: ./gradlew spotlessCheck

pre-push:
  parallel: false
  commands:
    frontend-testes:
      root: frontend/
      run: npm run testar
    backend-testes:
      root: backend/
      # Os dois: `check` é rápido e não exige Docker; `testeIntegracao` sobe o Testcontainers.
      # A separação por tag existe para o CI e para o dia a dia, não para pular teste no push.
      run: ./gradlew check testeIntegracao

commit-msg:
  commands:
    commitlint:
      run: npx --no -- commitlint --edit {1}
