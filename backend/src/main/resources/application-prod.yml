# Perfil de produção: log em JSON (ver logback-spring.xml) e DEBUG desligado.
logging:
  level:
    root: INFO
    br.com.aerodash.aether: INFO

spring:
  jpa:
    show-sql: false
  # Sem `db/seed`: os dados de desenvolvimento não existem em produção.
  flyway:
    locations: classpath:db/migration
    # Em produção a ordem é lei: uma migration que aparece fora de sequência é sinal de merge mal
    # resolvido ou de deploy pulado, e tem que travar a subida em vez de ser aplicada em silêncio.
    # O relaxamento do perfil padrão existe só por causa da faixa V900+ do seed local.
    out-of-order: false

springdoc:
  swagger-ui:
    enabled: false

aether:
  autenticacao:
    # Produção é HTTPS: o cookie de sessão não pode trafegar em claro.
    cookie-seguro: true
