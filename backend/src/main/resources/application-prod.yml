# Perfil de produção: log em JSON (ver logback-spring.xml) e DEBUG desligado.
logging:
  level:
    root: INFO
    br.com.aerodash.aether: INFO

spring:
  jpa:
    show-sql: false
  # Sem `db/seed`: os usuários de desenvolvimento não existem em produção.
  flyway:
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    enabled: false

aether:
  autenticacao:
    # Produção é HTTPS: o cookie de sessão não pode trafegar em claro.
    cookie-seguro: true
