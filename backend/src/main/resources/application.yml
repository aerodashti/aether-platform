spring:
  application:
    name: aether
  datasource:
    url: ${AETHER_BANCO_URL:jdbc:postgresql://localhost:5432/aether}
    username: ${AETHER_BANCO_USUARIO:aether}
    password: ${AETHER_BANCO_SENHA:aether}
  jpa:
    # O esquema é responsabilidade do Flyway; o Hibernate só confere se bate.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true

server:
  port: 8080
  error:
    include-message: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

aether:
  versao: 0.1.0

logging:
  level:
    root: INFO
    br.com.aerodash.aether: DEBUG
