spring:
  application:
    name: aether
  datasource:
    url: ${AETHER_BANCO_URL:jdbc:postgresql://localhost:5432/aether}
    username: ${AETHER_BANCO_USUARIO:aether}
    password: ${AETHER_BANCO_SENHA:aether}
  jpa:
    # O esquema é responsabilidade do Flyway; o Hibernate só confere se bate.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # `db/seed` traz os dados de desenvolvimento e é retirado no perfil de produção.
    locations: classpath:db/migration,classpath:db/seed
    # O seed usa a faixa V900+, e por isso ele fica SEMPRE à frente de qualquer migration nova:
    # criar a V4 depois de a V900 ter sido aplicada é, para o Flyway, uma migration fora de ordem,
    # e a validação recusa a subida. Sem isto, toda feature nova exigiria apagar o banco local.
    # Em produção `db/seed` não existe e este relaxamento é desligado — veja application-prod.yml.
    out-of-order: true
  threads:
    virtual:
      enabled: true

server:
  port: 8080
  error:
    include-message: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

aether:
  versao: 0.1.0
  # Política de acesso. São números de segurança, não constantes de código: mudam por ambiente.
  autenticacao:
    duracao-da-sessao: PT12H
    tentativas-ate-bloquear: 5
    duracao-do-bloqueio: PT15M
    validade-do-codigo: PT10M
    tentativas-por-codigo: 5
    intervalo-entre-codigos: PT1M
    # O convite é um link, não um código de seis dígitos: vale mais tempo porque a pessoa pode
    # levar um dia para abrir o e-mail, e a entropia do token é que o protege, não a janela curta.
    validade-do-convite: P2D
    endereco-do-convite: ${AETHER_ENDERECO_CONVITE:http://localhost:5173/entrar}
    remetente: ${AETHER_EMAIL_REMETENTE:nao-responda@aether.aerodash.com.br}
    # Em desenvolvimento o front roda em http://localhost: um cookie `Secure` não seria enviado.
    cookie-seguro: ${AETHER_COOKIE_SEGURO:false}

# Observabilidade: SDK do OpenTelemetry configurado por propriedade, sem Java Agent.
otel:
  service:
    name: aether
  # Por padrão nada é exportado: o console de dev fica com exatamente uma linha por request.
  #   OTEL_TRACES_EXPORTER=logging  -> despeja o span no console (mesma informação, forma de trace)
  #   OTEL_TRACES_EXPORTER=otlp     -> manda ao coletor de OTEL_EXPORTER_OTLP_ENDPOINT
  traces:
    exporter: ${OTEL_TRACES_EXPORTER:none}
  logs:
    exporter: ${OTEL_LOGS_EXPORTER:none}
  metrics:
    exporter: ${OTEL_METRICS_EXPORTER:none}
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
  instrumentation:
    # O FiltroDeLinhaCanonica é o dono do span de servidor; sem isto haveria dois por request.
    spring-webmvc:
      enabled: false

logging:
  level:
    root: INFO
    br.com.aerodash.aether: DEBUG
