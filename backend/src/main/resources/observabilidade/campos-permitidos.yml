# Política de sanitização de logs — fonte única.
#
# Regra: TUDO é mascarado por padrão. Um campo só aparece em claro na linha canônica se o nome
# dele estiver nesta lista. Campo fora da lista vira "***", em qualquer profundidade.
#
# Como adicionar um campo:
#   1. Pergunte se ele é necessário para investigar um request. Se não for, não adicione.
#   2. Pergunte se ele é dado pessoal, documento, credencial ou conteúdo escrito pelo usuário.
#      Se for, não adicione — registre um identificador em vez do valor.
#   3. Adicione o nome exato do campo (como aparece no JSON), em ordem alfabética, na seção certa.
#   4. Rode `./gradlew test --tests '*SanitizadorDeLogTest'`.
#
# A comparação é exata e sensível a maiúsculas: `situacaoGeral` não libera `situacaogeral`.
campos:
  # Identificadores e metadados de plataforma
  - detail
  - id
  - instance
  - requisicao
  - status
  - title
  - type
  - versao

  # Feature saude (exemplo do bootstrap)
  - componente
  - componentes
  - saudavel
  - situacao
  - situacaoGeral
  - verificadoEm
