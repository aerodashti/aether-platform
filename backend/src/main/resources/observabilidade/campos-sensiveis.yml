# Política de sanitização de logs — fonte única.
#
# Regra: por padrão um campo aparece em claro na linha canônica. Os listados aqui são mascarados,
# em qualquer profundidade e em qualquer corpo de request ou response.
#
# Formato: `nome-do-campo: estrategia`.
#
# Estratégias:
#   cpf  — preserva só os cinco últimos dígitos: 12345678901 vira ***.***.789-01
#   (qualquer outro valor) — mascara o campo inteiro como ***
# A estratégia desconhecida cai no caso seguro de propósito: errar o nome esconde demais,
# nunca de menos.
#
# Como adicionar um campo:
#   1. Pergunte se ele é dado pessoal, documento, credencial ou conteúdo escrito pelo usuário.
#      Se não for nada disso, não precisa entrar aqui.
#   2. Escolha a estratégia. Na dúvida, mascare inteiro.
#   3. Adicione o nome exato do campo, como ele aparece no JSON, em ordem alfabética.
#   4. Rode `./gradlew test --tests '*SanitizadorDeLogTest'`.
#
# A comparação é exata e sensível a maiúsculas: `cpf` não cobre `CPF` nem `cpfDoProprietario`.
campos:
  # Credencial de uso único: aparece no corpo de /autenticacao/recuperacao/codigo.
  codigo: integral
  # Token do link de convite: credencial de uso único, aparece no corpo de
  # /autenticacao/convite/senha.
  convite: integral
  # Documento da empresa. Público no Brasil, mas a política deste arquivo manda mascarar
  # documento — e um CNPJ em log de produção não ajuda ninguém a depurar nada.
  cnpj: integral
  # Código ANAC do tripulante: documento pessoal.
  canac: integral
  cpf: cpf
  # Conteúdo livre escrito pelo usuário no lançamento de custo.
  descricao: integral
  # Documento do proprietário: CPF ou CNPJ no mesmo campo. Mascarado inteiro porque a
  # estratégia `cpf` assume 11 dígitos e aqui podem ser 14.
  cpfCnpj: integral
  # Dado pessoal. Para ligar um request a uma pessoa existe `usuario.id`, que não identifica
  # ninguém fora do banco e já é registrado pelo serviço de autenticação.
  email: integral
  # Documento fiscal do lançamento.
  notaFiscal: integral
  novaSenha: integral
  # Conteúdo livre escrito pelo usuário no trecho do diário de voos.
  observacoes: integral
  senha: integral
  senhaAtual: integral
  # Dado pessoal de contato do proprietário.
  telefone: integral
