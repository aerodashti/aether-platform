# Ambiente local do Aether. Apenas o banco: backend e frontend rodam na máquina.
services:
  postgres:
    image: postgres:16-alpine
    container_name: aether-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aether}
      POSTGRES_USER: ${POSTGRES_USER:-aether}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aether}
      # Ordenação e mensagens em português no banco local.
      LANG: pt_BR.utf8
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aether} -d ${POSTGRES_DB:-aether}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Coleta e visualização de traces e logs. Sobe só com o profile:
  #   docker compose -f infra/docker-compose.yml --profile observabilidade up -d
  observabilidade:
    image: openobserve/openobserve:v0.15.0
    container_name: aether-observabilidade
    profiles: ["observabilidade"]
    restart: unless-stopped
    environment:
      ZO_ROOT_USER_EMAIL: ${OBSERVABILIDADE_USUARIO:-dev@aerodash.com.br}
      ZO_ROOT_USER_PASSWORD: ${OBSERVABILIDADE_SENHA:-observabilidade}
      ZO_DATA_DIR: /data
    ports:
      - "5080:5080"
    volumes:
      - dados-observabilidade:/data

volumes:
  dados-postgres:
  dados-observabilidade:
